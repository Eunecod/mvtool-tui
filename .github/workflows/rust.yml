name: Rust Release Build

on:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check and create tag
        id: check_tag
        shell: bash
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag $TAG
            git push origin $TAG
          fi

  build-windows:
    runs-on: windows-latest
    needs: prepare
    env:
      TARGET: x86_64-windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --verbose

      - name: Package
        shell: powershell
        run: |
          $ASSET_NAME = "mvtool-${{ env.TARGET }}.tar"
          tar -cvf $ASSET_NAME -C target/release mvtool.exe
          echo "ASSET_NAME=$ASSET_NAME" >> $env:GITHUB_ENV

      - name: Upload Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: ""
          files: mvtool-${{ env.TARGET }}.tar
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    needs: prepare
    container:
      image: ubuntu:18.04
    env:
      TARGET: x86_64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --verbose

      - name: Package
        run: |
          ASSET_NAME="mvtool-${{ env.TARGET }}.tar"
          tar -cvf $ASSET_NAME -C target/release mvtool
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

      - name: Upload Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: ""
          files: mvtool-${{ env.TARGET }}.tar
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
