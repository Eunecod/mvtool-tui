# Cargo.toml

[workspace]
members = [
	"apps/mvtool",
	"libs/mvcore",
	"libs/mvframe",
	"libs/mvplugin",
	"libs/updater",
]
resolver = "2"

[workspace.package]
version = "2.8.5"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
codegen-units = 1
opt-level     = 3
lto           = true
strip         = true
panic         = 'abort'

[workspace.dependencies]
# async runtime
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }

# winit
winit = "0.30.13"

# imgui
imgui = { version = "0.12.0", features = ["docking"] }

# lua
mlua = { version = "0.10", features = ["luajit", "vendored"] }

# parse json
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.150"

# libs
mvcore   = { path = "libs/mvcore"   }
mvframe  = { path = "libs/mvframe"  }
mvplugin = { path = "libs/mvplugin" }
updater  = { path = "libs/updater"  }
